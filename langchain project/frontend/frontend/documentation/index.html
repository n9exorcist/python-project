<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <!--
      SAST Fix — CWE-16 (Security Misconfiguration)
      A Content-Security-Policy header is the primary defence; set it on the
      server (nginx.conf / FastAPI middleware).  This meta-tag equivalent is
      the fallback for static hosting and satisfies AppScan's CSP check.

      Policy rationale:
        default-src 'self'          – block everything not explicitly allowed
        script-src  'self' cdn.jsdelivr.net  – Bootstrap bundle only
        style-src   'self' 'unsafe-inline'   – Bootstrap + inline React styles;
                    cdn.jsdelivr.net fonts.googleapis.com
        font-src    'self' fonts.gstatic.com – Material Symbols font files
        img-src     'self' data:             – favicon + base64 images
        connect-src 'self'                   – API calls to own origin only
        frame-ancestors 'none'               – clickjacking protection
        form-action 'self'                   – no external form POSTs
        base-uri    'self'                   – prevent base-tag injection
        object-src  'none'                   – block Flash / plugins
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' https://cdn.jsdelivr.net;
        style-src   'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data:;
        connect-src 'self';
        frame-ancestors 'none';
        form-action 'self';
        base-uri    'self';
        object-src  'none';
      "
    />

    <!-- SAST Fix — CWE-16: X-Content-Type-Options prevents MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- SAST Fix — CWE-16: prevent referrer leakage to external origins -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Supply Chain &amp; Operations Benchmarking Tool</title>

    <!--
      Bootstrap CSS — pinned to exact semver 5.3.8.
      SAST Fix — CWE-16: referrerpolicy="no-referrer" added to all
      external <link> tags so the Referer header is never sent to CDN.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!--
      Google Fonts / Material Symbols — no SRI available for dynamic font URLs;
      SAST Fix — CWE-16: crossorigin="anonymous" + referrerpolicy="no-referrer"
      are the maximum practical hardening for these external stylesheet links.
      The CSP style-src directive above restricts these to known origins.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Bootstrap JS bundle — SRI hash pinned to 5.3.8.
      SAST Fix — CWE-16: referrerpolicy="no-referrer" added.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
